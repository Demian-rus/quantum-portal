name: КВИП TASK041 integration acceptance
on:
  pull_request:
    paths: ['party-game/**', 'diagnostics/task041/**', '.github/workflows/quip-task041-integration.yml']
permissions: {contents: read}
jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node editorial/quip/build-runtime.cjs --check
      - run: node --test party-game/tests/task041-runtime.test.cjs
  master:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {engine: chromium, width: 320}
          - {engine: chromium, width: 360}
          - {engine: chromium, width: 390}
          - {engine: chromium, width: 412}
          - {engine: webkit, width: 390}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save playwright-core@1.64.0
      - if: matrix.engine == 'webkit'
        run: npx playwright-core install --with-deps webkit
      - run: node diagnostics/task041/browser.cjs
        env:
          TASK041_WIDTH: ${{ matrix.width }}
          TASK041_ENGINE: ${{ matrix.engine }}
          CHROME_BIN: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quip-task041-${{ matrix.engine }}-${{ matrix.width }}
          path: artifacts/quip-task041
          if-no-files-found: error
