name: КВИП TASK044 stability
on:
  pull_request:
    paths: ['party-game/**', 'diagnostics/task044/**', '.github/workflows/quip-task044.yml']
permissions: {contents: read}
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test party-game/tests/task044.test.cjs
  text-layout:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: {engine: [chromium, webkit]}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - if: matrix.engine == 'chromium'
        run: npm install --no-save playwright-core@1.55.0
      - if: matrix.engine == 'webkit'
        run: npm install --no-save playwright-core@1.64.0
      - run: npx playwright-core install --with-deps ${{ matrix.engine }}
      - run: node diagnostics/task044/rounds.cjs
        env: {ENGINE: '${{ matrix.engine }}'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quip-task044-text-${{ matrix.engine }}
          path: artifacts/quip-task044/rounds
          if-no-files-found: error
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save playwright-core@1.64.0
      - run: node diagnostics/task044/start.cjs
        env:
          TASK038_SIZE: '15000'
          CHROME_BIN: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quip-task044-start-15000
          path: artifacts/quip-task044/start
          if-no-files-found: error
