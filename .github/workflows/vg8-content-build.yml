name: VG8 temporary generated catalogs
on:
  push:
    branches:
      - content/general-games-v8-broad-20261029
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate and commit versioned catalogs
        run: |
          node party-game/scripts/content.cjs build
          if git diff --quiet -- party-game/cards.js party-game/content-packs.js; then
            echo "Generated catalogs already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add party-game/cards.js party-game/content-packs.js
          git commit -m "build(content): regenerate VG8 catalogs"
          git push origin HEAD:content/general-games-v8-broad-20261029
