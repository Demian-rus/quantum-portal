name: Temporary VG1 deterministic content rebuild
on:
  push:
    branches:
      - content/general-games-v1-20261029
    paths:
      - .github/workflows/quip-games-rebuild-temporary.yml
      - party-game/content/**
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build and validate immutable content plus VG1
        run: |
          node party-game/scripts/content.cjs build
          node party-game/scripts/content.cjs check
          node --test party-game/tests/general-games-v1.test.cjs party-game/tests/general-memes-v1.test.cjs party-game/tests/g47-editorial.test.cjs party-game/tests/g46-editorial.test.cjs
      - name: Commit deterministic generated files only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add party-game/cards.js party-game/content-packs.js party-game/approx-questions.js
          if ! git diff --cached --quiet; then
            git commit -m "build(games): deterministic general@51 generated modules"
            git push origin HEAD:content/general-games-v1-20261029
          fi
