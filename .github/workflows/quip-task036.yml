name: КВИП TASK036 stepper acceptance
on:
  push:
    branches: ['feat/quip-task036-*']
    paths: ['party-game/**', 'diagnostics/task036/**', '.github/workflows/quip-task036.yml']
  pull_request:
    paths: ['party-game/**', 'diagnostics/task036/**', '.github/workflows/quip-task036.yml']
permissions: {contents: read}
jobs:
  stepper:
    name: stepper (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save playwright-core@1.55.0
      - run: node diagnostics/task036/stepper.cjs
        env:
          QUIP036_ENGINE: chromium
          QUIP036_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CHROME_BIN: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quip-task036-stepper-chromium
          path: artifacts/quip-task036
          if-no-files-found: error
  stepper-webkit:
    name: stepper (webkit)
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.0-noble
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      # Official Playwright image already includes the matching WebKit browser
      # and native Ubuntu dependencies. No apt/Playwright install --with-deps.
      - run: npm install --no-save playwright-core@1.64.0
      # Checkout's JavaScript action and the container shell use different
      # HOME directories. Trust only this checked-out workspace for the shell.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: node diagnostics/task036/stepper.cjs
        env:
          QUIP036_ENGINE: webkit
          QUIP036_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quip-task036-stepper-webkit
          path: artifacts/quip-task036
          if-no-files-found: error
