name: G46 editorial final rebuild
on:
  push:
    branches: ['content/general-editorial-dedup-20261028']
    paths: ['party-game/content/**', '.github/workflows/g46-editorial-rebuild-once.yml']
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deterministic content generation and editorial checks
        run: |
          node party-game/scripts/content.cjs build
          node party-game/scripts/content.cjs check
          node --test party-game/tests/g46-editorial.test.cjs
      - name: Commit generated content only
        run: |
          git diff --exit-code -- party-game/approx-questions.js
          git add party-game/cards.js party-game/content-packs.js
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build(content): regenerate reviewed G46 catalog [skip ci]'
            git push origin HEAD:refs/heads/content/general-editorial-dedup-20261028
          fi
