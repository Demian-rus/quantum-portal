name: G44 one-time catalog build
on:
  push:
    branches: ['content/general-diversity-g44-20261028']
    paths: ['party-game/content/**', '.github/workflows/g44-build-once.yml']
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deterministic content generation and G44 source checks
        run: |
          node party-game/scripts/content.cjs build
          node party-game/scripts/content.cjs check
          node --test party-game/tests/g44-content.test.cjs
      - name: Commit generated catalogs only
        run: |
          git diff --exit-code -- party-game/approx-questions.js
          git add party-game/cards.js party-game/content-packs.js
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build(content): deterministic G44 catalog [skip ci]'
            git push origin HEAD:refs/heads/content/general-diversity-g44-20261028
          fi
