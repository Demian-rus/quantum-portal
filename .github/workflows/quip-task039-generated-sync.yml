name: TASK039 one-off generated catalog sync
on:
  push:
    branches:
      - feat/quip-task039-blitz-all-levels-score-and-category-review-20261031
    paths:
      - .github/workflows/quip-task039-generated-sync.yml
permissions:
  contents: write
jobs:
  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/quip-task039-blitz-all-levels-score-and-category-review-20261031
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate editorial data and regenerate immutable catalogs
        run: node party-game/scripts/content.cjs build
      - name: Commit generated resources on task branch
        run: |
          git add party-game/cards.js party-game/approx-questions.js party-game/content-packs.js
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "build(TASK039): regenerate catalog from versioned editorial sources"
            git push origin HEAD:feat/quip-task039-blitz-all-levels-score-and-category-review-20261031
          fi
