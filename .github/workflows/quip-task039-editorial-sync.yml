name: TASK039 editorial generated catalog sync
on:
  push:
    branches:
      - feat/quip-task039-blitz-all-levels-score-and-category-review-20261031
    paths:
      - .github/workflows/quip-task039-editorial-sync.yml
permissions:
  contents: write
jobs:
  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/quip-task039-blitz-all-levels-score-and-category-review-20261031
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and deterministically regenerate all catalogs
        run: |
          node party-game/scripts/content.cjs build
          node party-game/scripts/content.cjs check
      - name: Commit only generated catalogs back to existing TASK039 branch
        run: |
          git add party-game/cards.js party-game/approx-questions.js party-game/content-packs.js
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "build(TASK039): compile editorially reviewed general@68"
            git push origin HEAD:feat/quip-task039-blitz-all-levels-score-and-category-review-20261031
          fi
