name: Browser geometry smoke
on:
  push:
    branches:
      - feat/crossword-geometry-20261020
      - feat/responsive-gameplay-layout-20261020
      - feat/crisp-crossword-desktop-tools-20261020
      - main
  workflow_dispatch:
jobs:
  chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright-core@1.55.0
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/quantum-portal-http.log 2>&1 &
      - run: node tests/browser-smoke.cjs
      - run: node tests/responsive-layout.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geometry-screenshots
          path: artifacts/
          if-no-files-found: ignore
