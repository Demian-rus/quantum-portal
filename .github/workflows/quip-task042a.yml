name: КВИП TASK042A mobile rounds
on:
  pull_request:
    paths: ['party-game/**', 'diagnostics/task042/**', '.github/workflows/quip-task042a.yml']
permissions: {contents: read}
jobs:
  rounds:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: {engine: [chromium, webkit]}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save playwright-core@1.55.0
      - run: npx playwright-core install --with-deps ${{ matrix.engine }}
      - run: node --test party-game/tests/task042a.test.cjs
      - run: node diagnostics/task042/rounds.cjs
        env: {ENGINE: '${{ matrix.engine }}'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quip-task042a-${{ matrix.engine }}
          path: artifacts/quip-task042a
