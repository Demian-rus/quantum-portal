name: КВИП native touch highlight hotfix
on:
  push:
    branches: ['fix/quip-touch-highlight-*']
    paths: ['party-game/**', 'diagnostics/touch-highlight/**', '.github/workflows/quip-touch-highlight.yml']
  pull_request:
    paths: ['party-game/**', 'diagnostics/touch-highlight/**', '.github/workflows/quip-touch-highlight.yml']
permissions: {contents: read}
jobs:
  touch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - if: matrix.engine == 'chromium'
        run: npm install --no-save playwright-core@1.55.0
      - if: matrix.engine == 'webkit'
        run: npm install --no-save playwright-core@1.64.0
      - if: matrix.engine == 'webkit'
        run: npx playwright-core install --with-deps webkit
        timeout-minutes: 8
      - run: node --test party-game/tests/touch-highlight.test.cjs
      - run: node diagnostics/touch-highlight/touch.cjs
        env:
          TOUCH_ENGINE: ${{ matrix.engine }}
          TOUCH_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CHROME_BIN: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quip-native-touch-${{ matrix.engine }}
          path: artifacts/touch-highlight
          if-no-files-found: error
