name: G47 isolated deterministic catalog rebuild
on:
  push:
    branches:
      - content/g47-verified-dedup-complications-20261028
    paths:
      - 'party-game/content/**'
      - '.github/workflows/g47-editorial-rebuild.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild and verify authored catalog
        run: |
          node party-game/scripts/content.cjs build
          node party-game/scripts/content.cjs check
          node --test party-game/tests/g46-editorial.test.cjs party-game/tests/g47-editorial.test.cjs
      - name: Commit generated runtime artifacts only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add party-game/cards.js party-game/content-packs.js
          if ! git diff --cached --quiet; then
            git diff --cached --name-only
            git commit -m "build(g47): regenerate versioned static card and pack catalogs"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
