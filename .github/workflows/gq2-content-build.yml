name: GQ2 temporary content regeneration
on:
  push:
    branches:
      - content/approx-events-v2-20261029
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate numeric catalogs
        run: |
          node party-game/scripts/content.cjs build
          node party-game/scripts/content.cjs check
          if git diff --quiet -- party-game/approx-questions.js party-game/content-packs.js; then
            echo "Generated artifacts synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add party-game/approx-questions.js party-game/content-packs.js
          git commit -m "build(content): regenerate GQ2 numbers general@63"
          git fetch origin content/approx-events-v2-20261029
          git rebase origin/content/approx-events-v2-20261029
          git push origin HEAD:content/approx-events-v2-20261029
