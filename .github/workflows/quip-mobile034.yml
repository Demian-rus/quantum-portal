name: КВИП TASK034 mobile baseline and acceptance
on:
  push:
    branches: ['feat/quip-task034-mobile-*', main]
    paths: ['diagnostics/task034/**', 'party-game/**', '.github/workflows/quip-mobile034.yml']
  pull_request:
    paths: ['diagnostics/task034/**', 'party-game/**', '.github/workflows/quip-mobile034.yml']
permissions: {contents: read}
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        group: [android-compact, android-tall, iphone-webkit, landscape]
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      # WebKit 1.55.0 on this runner loses CacheStorage writes, including on
      # baseline main. Keep Chromium/raster tooling pinned; update only WebKit.
      - if: matrix.group != 'iphone-webkit'
        run: npm install --no-save playwright-core@1.55.0
      - if: matrix.group == 'iphone-webkit'
        run: npm install --no-save playwright-core@1.64.0
      - if: matrix.group == 'iphone-webkit'
        run: npx playwright-core install --with-deps webkit
        timeout-minutes: 8
      - run: node diagnostics/task034/mobile.cjs
        env:
          QUIP034_GROUP: ${{ matrix.group }}
      - run: node diagnostics/task034/evidence.cjs
        if: always()
        env:
          QUIP034_GROUP: ${{ matrix.group }}
          QUIP034_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quip-task034-mobile-${{ matrix.group }}
          path: artifacts/quip-task034
          if-no-files-found: error
  installed-pwa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save playwright-core@1.55.0
      - run: node diagnostics/task034/installed-pwa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quip-task034-installed-pwa
          path: artifacts/quip-task034/installed-pwa
          if-no-files-found: error
