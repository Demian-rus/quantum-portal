name: КВИП TASK042B device dictionary
on:
  pull_request:
    paths: ['party-game/**', 'server/quip-dictionary/**', 'diagnostics/task042/**', '.github/workflows/quip-task042b.yml']
permissions: {contents: read}
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test party-game/tests/task042b.test.cjs server/quip-dictionary/tests/*.test.cjs
  mobile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: {engine: [chromium, webkit]}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - if: matrix.engine == 'chromium'
        run: npm install --no-save playwright-core@1.55.0
      - if: matrix.engine == 'webkit'
        run: npm install --no-save playwright-core@1.64.0
      - run: npx playwright-core install --with-deps ${{ matrix.engine }}
      - run: node diagnostics/task042/dictionary.cjs
        env: {ENGINE: '${{ matrix.engine }}'}
      - if: matrix.engine == 'chromium'
        run: |
          node diagnostics/task042/dictionary-upgrade.cjs
          node diagnostics/task042/dictionary-snapshot.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quip-task042b-${{ matrix.engine }}
          path: artifacts/quip-task042b
          if-no-files-found: error
