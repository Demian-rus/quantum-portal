name: КВИП Android exploratory CPU trace
on:
  push:
    branches: ['feat/quip-task029-*']
    paths: ['.github/workflows/quip-wizard-cpu-probe.yml']
permissions: {contents: read}
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save playwright-core@1.55.0
      # Exploratory attribution only; n=1 is not an acceptance measurement.
      # The separate Android performance workflow collects all formal n=20 data.
      - run: node diagnostics/task029/mobile-perf.cjs
        env: {PERF_PILOT: '1', PERF_WIDTH: '390', PERF_REPEATS: '1'}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: android-exploratory-trace-not-benchmark, path: artifacts/task029, if-no-files-found: error}
