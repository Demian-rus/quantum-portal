name: КВИП TASK043 dictionary expansion
on:
  pull_request:
    paths: ['party-game/**', 'editorial/quip/**', 'diagnostics/task043/**', '.github/workflows/quip-task043.yml']
permissions: {contents: read}
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node party-game/scripts/content.cjs check
      - run: node editorial/quip/editor.cjs check --release
      - run: node editorial/quip/build-runtime.cjs --check
      - run: node editorial/quip/build-runtime.cjs --edition=2 --check
      - run: node --test party-game/tests/task043.test.cjs
  candidate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: {engine: [chromium, webkit]}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save playwright-core@1.55.0
      - run: npx playwright-core install --with-deps ${{ matrix.engine }}
      - run: node diagnostics/task043/browser.cjs
        env: {ENGINE: '${{ matrix.engine }}'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quip-task043-${{ matrix.engine }}
          path: artifacts/quip-task043
          if-no-files-found: error
