name: КВИП TASK043 dictionary expansion
on:
  pull_request:
    paths: ['party-game/**', 'editorial/quip/**', 'diagnostics/task043/**', '.github/workflows/quip-task043.yml']
permissions: {contents: read}
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node party-game/scripts/content.cjs check
      - run: node editorial/quip/editor.cjs check --release
      - run: node editorial/quip/build-runtime.cjs --check
      - run: node editorial/quip/build-runtime.cjs --edition=2 --check
      - run: node --test party-game/tests/task043.test.cjs
  candidate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: {engine: [chromium, webkit]}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - if: matrix.engine == 'chromium'
        run: npm install --no-save playwright-core@1.55.0
      # Use the supported WebKit storage/runtime revision already used by
      # TASK034/038. Chromium's historical raster driver remains pinned.
      - if: matrix.engine == 'webkit'
        run: npm install --no-save playwright-core@1.64.0
      - run: npx playwright-core install --with-deps ${{ matrix.engine }}
      - run: node diagnostics/task043/browser.cjs
        env: {ENGINE: '${{ matrix.engine }}'}
      - if: matrix.engine == 'chromium'
        run: node diagnostics/task042/dictionary-upgrade.cjs
        env: {QUIP_UPGRADE_BASE: '0584e0df435782eec8a31d5f5040ac517d300315', QUIP_UPGRADE_ROLLBACK: '1'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quip-task043-${{ matrix.engine }}
          path: |
            artifacts/quip-task043
            artifacts/quip-task042b
          if-no-files-found: error
