name: КВИП TASK035 timer and range acceptance
on:
  push:
    branches: ['feat/quip-task035-*']
    paths: ['party-game/**', 'diagnostics/task035/**', '.github/workflows/quip-task035.yml']
  pull_request:
    paths: ['party-game/**', 'diagnostics/task035/**', '.github/workflows/quip-task035.yml']
permissions: {contents: read}
jobs:
  timer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - if: matrix.engine == 'chromium'
        run: npm install --no-save playwright-core@1.55.0
      - if: matrix.engine == 'webkit'
        run: npm install --no-save playwright-core@1.64.0 && npx playwright-core install --with-deps webkit
      - run: node --test party-game/tests/task035.test.cjs
      - run: node diagnostics/task035/timer.cjs
        env:
          QUIP035_ENGINE: ${{ matrix.engine }}
          CHROME_BIN: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quip-task035-timer-${{ matrix.engine }}
          path: artifacts/quip-task035
          if-no-files-found: error
  sliders:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save playwright-core@1.55.0
      - run: node diagnostics/task035/range-lifecycle.cjs
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - run: node diagnostics/task035/sliders.cjs
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quip-task035-sliders-before-after
          path: artifacts/quip-task035
          if-no-files-found: error
